<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TECHNOVERSE — AR Portal</title>
  <link rel="stylesheet" href="../styles.css" />
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* ══════════════════════════════════════════
       BASE OVERRIDES & BLACK CAMERA PATCHES
       ══════════════════════════════════════════ */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent !important;
    }

    /* Prevent MindAR/A-Frame from crushing or hiding the video stream canvas */
    .a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
    }

    /* Suppress default MindAR UI indicators to preserve TECHNOVERSE branding */
    .mindar-ui-loading, .mindar-ui-compatibility {
      display: none !important;
    }

    /* ══════════════════════════════════════════
       HEADS-UP DISPLAY (HUD) LAYER
       ══════════════════════════════════════════ */
    .ar-hud-layer {
      position: absolute;
      inset: 0;
      z-index: 9999; /* Forces HUD layers explicitly above webGL canvas */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none; /* Let touches pass through to webGL context if needed */
    }

    .interactive-element {
      pointer-events: auto; /* Restores click functionality onto buttons */
    }

    /* Top Navigation Banner */
    .ar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(238,242,249,0.85) 0%, rgba(238,242,249,0) 100%);
      backdrop-filter: blur(4px);
    }

    .btn-back {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--blue);
      padding: 8px 14px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(21,101,192,0.1);
    }

    /* Scanning Status Pill */
    .status-pill {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(21,101,192,0.08);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--blue-bright);
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .status-dot.active {
      background: #4caf50;
      animation: pulseGlow 1.2s infinite;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Center Aiming Reticle Framework */
    .ar-reticle-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .reticle-bracket {
      width: 200px;
      height: 200px;
      border: 2px solid rgba(21, 101, 192, 0.15);
      position: relative;
    }

    .reticle-bracket::before, .reticle-bracket::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--blue-bright);
      border-style: solid;
    }
    
    .reticle-bracket::before { top: -4px; left: -4px; border-width: 3px 0 0 3px; }
    .reticle-bracket::after { bottom: -4px; right: -4px; border-width: 0 3px 3px 0; }

    .reticle-corners-alt::before, .reticle-corners-alt::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--blue-bright);
      border-style: solid;
    }
    .reticle-corners-alt::before { top: -4px; right: -4px; border-width: 3px 3px 0 0; }
    .reticle-corners-alt::after { bottom: -4px; left: -4px; border-width: 0 0 3px 3px; }

    .reticle-center {
      position: absolute;
      font-size: 18px;
      color: var(--blue-bright);
      animation: spinCenter 12s linear infinite;
    }

    @keyframes spinCenter { to { transform: rotate(360deg); } }

    /* Bottom Information Prompt */
    .ar-footer-prompt {
      padding: 24px 20px;
      background: linear-gradient(0deg, rgba(238,242,249,0.9) 0%, rgba(238,242,249,0.4) 70%, transparent 100%);
      backdrop-filter: blur(4px);
      text-align: center;
    }

    .prompt-box {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(21, 101, 192, 0.12);
    }

    .prompt-box p {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .prompt-box span {
      display: block;
      font-size: 11px;
      color: var(--grey);
      font-family: 'Orbitron', monospace;
      margin-top: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="ar-hud-layer">
    
    <header class="ar-header">
      <button class="btn-back interactive-element" id="backToDash">
        ◀ DASHBOARD
      </button>
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">SCANNING SYSTEM</span>
      </div>
    </header>

    <div class="ar-reticle-container" id="reticle">
      <div class="reticle-bracket">
        <div class="reticle-corners-alt"></div>
      </div>
      <div class="reticle-center">⬡</div>
    </div>

    <footer class="ar-footer-prompt">
      <div class="prompt-box">
        <p id="instructionText">Scan your structural target artwork or marker</p>
        <span>Align pattern within tracking matrix</span>
      </div>
    </footer>

  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no;" 
    embedded 
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    id="arScene"
  >
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="mindTarget">
      
      <a-entity
        position="0 0 0"
        rotation="90 0 0"
        scale="0.05 0.05 0.05"
        gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"
      ></a-entity>

    </a-entity>

  </a-scene>

  <script>
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const reticle = document.getElementById('reticle');
    const instructionText = document.getElementById('instructionText');

    // UI Back-nav hook execution sequence
    document.getElementById('backToDash').addEventListener('click', () => {
      window.location.href = 'dashboard.html';
    });

    // Tracking Event Subscriptions mapped directly into MindAR Target Lifecycle loops
    const targetEntity = document.getElementById('mindTarget');

    targetEntity.addEventListener("targetFound", () => {
      statusText.textContent = "TARGET ACQUIRED";
      statusText.style.color = "#4caf50";
      statusDot.classList.add('active');
      
      // Dim tracking reticle frame to emphasize the clean 3D render display layout
      reticle.style.opacity = "0.15";
      instructionText.textContent = "3D MATRIX GRAPHIC DEPLOYED";
    });

    targetEntity.addEventListener("targetLost", () => {
      statusText.textContent = "SCANNING SYSTEM";
      statusText.style.color = "var(--blue)";
      statusDot.classList.remove('active');
      
      reticle.style.opacity = "1";
      instructionText.textContent = "Scan your structural target artwork or marker";
    });
  </script>
</body>
</html>
